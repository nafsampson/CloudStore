# //summary//
# Verifies a release and deploys its web and worker artifacts through Azure OIDC.
# //summary//
# //-------------------Start Of File------------------//
name: Deploy reviewed CloudStore apps
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudstore-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore projects serially
        run: |
          dotnet restore src/CloudStore.Web/CloudStore.Web.csproj --disable-parallel
          dotnet restore src/CloudStore.Functions/CloudStore.Functions.csproj --disable-parallel
          dotnet restore tests/CloudStore.Tests/CloudStore.Tests.csproj --disable-parallel
      - run: dotnet build CloudStore.slnx -c Release --no-restore --maxcpucount:1
      - run: dotnet test tests/CloudStore.Tests -c Release --no-build --no-restore --logger "trx;LogFileName=security.trx" --results-directory TestResults
      - name: Publish web app
        run: dotnet publish src/CloudStore.Web -c Release --no-build --no-restore -o artifacts/web
      - name: Publish worker
        run: dotnet publish src/CloudStore.Functions -c Release --no-build --no-restore -o artifacts/worker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-packages
          path: artifacts/
          # The isolated worker requires its generated .azurefunctions directory.
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-test-results
          path: TestResults/*.trx
  deploy:
    needs: verify
    environment: azure-production
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name deployment-packages --dir artifacts
      - name: Validate downloaded worker package
        run: |
          test -f artifacts/worker/host.json
          test -f artifacts/worker/worker.config.json
          test -d artifacts/worker/.azurefunctions
          test -n "$(find artifacts/worker/.azurefunctions -type f -print -quit)"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: artifacts/worker
          sku: flexconsumption
      - uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/web
      - name: Verify web liveness
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors "https://${APP_NAME}.azurewebsites.net/health/live"
# //-------------------End Of File------------------//
