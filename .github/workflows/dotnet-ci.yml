# //summary//
# Builds and tests changes without Azure credentials and retains test results.
# //summary//
# //-------------------Start Of File------------------//
# Builds and tests the CloudStore solution without cloud credentials.
name: .NET CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Compile infrastructure without Azure credentials
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/cloudstore-template.json
          az bicep build --file infra/github-identity.bicep --outfile /tmp/cloudstore-oidc.json
          az bicep build-params --file infra/existing.bicepparam --outfile /tmp/cloudstore-parameters.json
      - name: Restore MVC application
        run: dotnet restore src/CloudStore.Web/CloudStore.Web.csproj --disable-parallel
      - name: Restore Functions worker and generated extensions
        run: dotnet restore src/CloudStore.Functions/CloudStore.Functions.csproj --disable-parallel
      - name: Restore security tests
        run: dotnet restore tests/CloudStore.Tests/CloudStore.Tests.csproj --disable-parallel
      - name: Build solution
        run: dotnet build CloudStore.slnx --configuration Release --no-restore --maxcpucount:1
      - name: Run security, order, upload and local demo tests
        run: dotnet test tests/CloudStore.Tests/CloudStore.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=security.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
# //-------------------End Of File------------------//
